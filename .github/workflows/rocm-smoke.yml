name: rocm-smoke

# Manual-only end-to-end smoke on a self-hosted gfx1100 ROCm runner.
# SECURITY: this runs untrusted checkout + model inference on a self-hosted
# runner. It is NEVER triggered by push or pull_request, and must NOT be enabled
# on fork PRs. Only a trusted maintainer dispatches it on a dedicated, isolated
# machine that holds the model weights and dataset.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref (branch/tag/sha) to smoke-test"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, rocm, gfx1100]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: doctor (env + model + dataset; no inference)
        run: |
          pip install -e ".[client,dev]"
          python -c "import torch; print('torch', torch.__version__, 'hip', torch.version.hip)"
          hunyuan-ocr doctor || true
      - name: tiny end-to-end smoke (1 page, requires servers up)
        run: |
          echo "NOTE: operator must start llama-servers first (see README Quick Start)."
          echo "This step runs a single-page predict -> validate against a 1-page GT."
          # GT_JSON=/path/to/tiny.json PORTS=8081 python scripts/run_phase2_vllm.py ...
          echo "(configure per host; left intentionally non-executing by default)"
